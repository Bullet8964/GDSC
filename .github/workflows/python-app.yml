name: Get Taiwan Stock Price

on:
  schedule:
    # 01:00 ~ 04:55 UTC
    # = Taiwan 09:00 ~ 12:55
    - cron: "*/5 1-4 * * 1-5"

    # 05:00 ~ 05:30 UTC
    # = Taiwan 13:00 ~ 13:30
    - cron: "0,5,10,15,20,25,30 5 * * 1-5"

  # 允許手動執行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 下載 Repository 裡的程式碼
      - name: Check out code
        uses: actions/checkout@v4

      # 設定 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 安裝套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 執行 Python
      - name: Run Python script
        run: python test1.py
